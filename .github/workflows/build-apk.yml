name: Build AlarmHQ APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Debug file listing
        working-directory: app
        run: |
          echo "=== PWD ==="
          pwd
          echo "=== lib/screens ==="
          ls -la lib/screens/ | head -15
          echo "=== lib/main.dart exists? ==="
          ls -lh lib/main.dart

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: 'stable'

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Analyze
        working-directory: app
        run: flutter analyze

      - name: Build Release APK
        working-directory: app
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alarmhq-release-apk
          path: app/build/app/outputs/flutter-apk/app-*-release.apk
