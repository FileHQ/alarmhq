name: alarmhq
description: AlarmHQ - personal alarm app (Urdu + English).
publish_to: 'none'
version: 1.0.39+4040

environment:
  sdk: ^3.13.5

# Zero third-party dependencies on purpose: everything native goes through
# hand-written platform channels (see android/app/src/main/kotlin), so the
# project resolves fully offline and has no plugin failure modes.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/tones/
    - assets/hijri/
  # v2.39: Embedded Noto Nastaliq Urdu, SUBSET to Urdu/Arabic script only
  # (no Latin, no digits). Urdu text renders in Nastaliq; English text and
  # all numbers (123) automatically fall back to the system font.
  fonts:
    - family: NotoNastaliqUrdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-Regular.ttf
        - asset: assets/fonts/NotoNastaliqUrdu-Bold.ttf
          weight: 700
